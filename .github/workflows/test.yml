name: Continuous Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 1-5'
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      # Pin vpython's virtualenv cache to a known path so it can be cached
      # between runs (the tests pass this through to spawned CLI processes).
      # Not overridden on Windows — vpython uses its default LocalAppData
      # location there, which is listed in the cache paths instead.
      VPYTHON_VIRTUALENV_ROOT: ${{ matrix.os != 'windows-latest' && format('{0}/.vpython-root', github.workspace) || '' }}
    steps:
    - name: Set git global config (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
        git config --global core.filemode false
        git config --global core.fscache true
        git config --global core.longpaths true
        git config --global core.preloadindex true
        git config --global branch.autosetuprebase always
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # tag: v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # tag: v7.0.0
      with:
        node-version: lts/-1
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # tag: v6.1.0
      with:
        path: node_modules
        key: ${{ runner.os }}-${{ hashFiles('yarn.lock') }}-node-modules
    - name: Install
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: yarn install --immutable
    - name: Build
      run: yarn build
    - name: Get depot_tools cache key
      id: depot-tools-key
      shell: bash
      run: echo "week=$(date -u +%Y-%W)" >> "$GITHUB_OUTPUT"
    - name: Cache depot_tools
      id: cache-depot-tools
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # tag: v6.1.0
      with:
        path: |
          third_party/depot_tools
          .vpython-root
          ~/AppData/Local/vpython-root
          ~/.vpython-root
        # depot_tools is a rolling checkout with nothing to hash, so rotate
        # the key weekly to keep the cached copy fresh; restore-keys lets a
        # new week start from last week's cache instead of a cold bootstrap.
        key: ${{ runner.os }}-depot-tools-${{ steps.depot-tools-key.outputs.week }}
        restore-keys: |
          ${{ runner.os }}-depot-tools-
    - name: Clone depot_tools
      if: steps.cache-depot-tools.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ ! -e third_party/depot_tools ]; then
          git clone -q https://chromium.googlesource.com/chromium/tools/depot_tools.git third_party/depot_tools
        fi
    - name: Update depot_tools (Windows)
      if: matrix.os == 'windows-latest' && steps.cache-depot-tools.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        Remove-Item -Force -ErrorAction Ignore third_party\depot_tools\.disable_auto_update
        & .\third_party\depot_tools\update_depot_tools.bat
        exit $LASTEXITCODE
    - name: Update depot_tools
      if: matrix.os != 'windows-latest' && steps.cache-depot-tools.outputs.cache-hit != 'true'
      run: |
        rm -f third_party/depot_tools/.disable_auto_update
        third_party/depot_tools/update_depot_tools
    - name: Disable depot_tools auto-update
      shell: bash
      run: touch third_party/depot_tools/.disable_auto_update
    - name: Test
      run: yarn test
